<!DOCTYPE html>
<html>

<head>

    <title>Movie Recommendation System</title>

    <style>

        body{
            font-family: Arial;
            text-align:center;
            background:#f4f4f4;
        }

        .movie-card{
            display:inline-block;
            width:220px;
            margin:15px;
            padding:10px;
            background:white;
            border-radius:10px;
            box-shadow:0px 0px 5px gray;
        }

        img{
            width:180px;
            border-radius:10px;
        }

        input{
            padding:10px;
            width:300px;
        }

        button{
            padding:10px 20px;
        }

    </style>

</head>

<body>

<h1>Prajwal Movie Recommendation System</h1>

    <form method="POST">

    <select name="search_type">

        <option value="movie">
            Movie Name
        </option>

        <option value="actor">
            Actor Name
        </option>

        <option value="genre">
            Genre
        </option>

        <option value="year">
            Year
        </option>

    </select>

    <input
        type="text"
        name="query"
        placeholder="Enter value"
        required>

    <button type="submit">
        Search
    </button>

</form>


<br>

{% if recommendations %}

    {% for movie in recommendations %}

    <div class="movie-card">

        {% if movie["poster"] %}
        <img src="{{ movie['poster'] }}">
        {% endif %}

        <h3>{{ movie["title"] }}</h3>

        <p>
            Rating: {{ movie["rating"] }}
        </p>

        <p>
            Year: {{ movie["year"] }}
        </p>

    </div>

    {% endfor %}

{% endif %}

</body>

</html>
