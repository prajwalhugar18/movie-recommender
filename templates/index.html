<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        form {
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 200px;
            padding: 15px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 5px;
            height: 280px;
            object-fit: cover;
            background-color: #ddd;
        }
        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }
        .card p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Movie Recommendation System</h1>

    <form method="POST">
        <input type="text" name="movie" placeholder="Enter Movie Name" required>
        <button type="submit">Search</button>
    </form>

    <div class="container">
        {% for movie in recommendations %}
            <div class="card">
                {% if movie['poster'] %}
                    <img src="{{ movie['poster'] }}" alt="{{ movie['title'] }} Poster">
                {% else %}
                    <div style="height:280px; background:#eee; display:flex; align-items:center; justify-content:center;">
                        <span>No Poster</span>
                    </div>
                {% endif %}
                <h3>{{ movie['title'] }}</h3>
                <p>Rating: {{ movie['rating'] }}</p>
                <p>Year: {{ movie['year'] }}</p>
            </div>
        {% endfor %}
    </div>

</body>
</html>
